version: '3.8'

services:

  lms-user-auth:
    image: arqsoftmarisapedro1/arqsoft:lms-user-auth
    restart: unless-stopped
    depends_on:
      - lms-rabbitamqp
    environment:
      - SPRING_PROFILES_ACTIVE=bootstrap, sql, idGeneratorHash, facebook, recommendationY
      - spring.datasource.url=jdbc:postgresql://postgres:${POSTGRES_PORT:-5432}/postgres
      - spring.datasource.username=postgres
      - spring.datasource.password=password
      - file.upload-dir=/tmp/uploads-psoft-g1-instance1
      - spring.rabbitmq.host=rabbitmq
    volumes:
      - "uploaded_files_volume_1:/tmp"
    deploy:
      replicas: 1
    ports:
      - "80895:8080" # Expose the lmsbooks service on port 8087
    networks:
      - lms-overlay-network

networks:
  lms-overlay-network:
    external: true

volumes:
  uploaded_files_volume_1:
  uploaded_files_volume_2: